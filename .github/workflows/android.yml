name: Android Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: SDK and reference-server tests
        run: python3 -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Test, lint and compile
        run: ./gradlew :core-model:test :app:testDebugUnitTest :core-playback:lintDebug :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core-model/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: auralis-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
