name: Gradle Dependency Graph
on:
  push:
    branches: [main]
    paths: ['**/*.gradle.kts', '**/gradle.lockfile', 'gradle/**', '.github/workflows/dependency-graph.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Submit resolved Gradle dependencies
        continue-on-error: true
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          additional-arguments: --no-daemon --no-configuration-cache
          dependency-graph: generate-and-submit
          dependency-graph-include-configurations: '.*[Rr]untimeClasspath'
