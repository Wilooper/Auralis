name: Android build environment
description: Configure JDK, Android command-line tools, platform 36 and Gradle
inputs:
  cache-disabled:
    description: Disable Gradle caching for traced CodeQL or signing jobs
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android command-line tools and SDK packages
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
        log-accepted-android-sdk-licenses: false
    - name: Verify SDK and wrapper
      shell: bash
      run: |
        command -v sdkmanager
        sdkmanager --version
        test -d "$ANDROID_HOME/platforms/android-36"
        test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
        chmod +x gradlew
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
